<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Viewer iframe bridge example</title>
<h1>Viewer bridge</h1>
<button id="show" disabled>Show cube</button>
<button id="hide" disabled>Hide cube</button>
<p id="status">Waiting for the viewer plugin…</p>
<iframe id="viewer" title="Cloned Spaces viewer" style="width:100%;height:70vh;border:0"></iframe>
<script type="module">
    // Replace this with your deployed viewer URL. Serve this page over HTTP(S).
    // Configure the plugin's parentOrigin to this page's exact origin in the trusted viewer config.
    const viewerUrl = 'https://viewer.example.com/project'
    const viewerOrigin = new URL(viewerUrl).origin
    const iframe = document.querySelector('#viewer')
    const status = document.querySelector('#status')
    const show = document.querySelector('#show')
    const hide = document.querySelector('#hide')
    const channel = 'clonedspaces-example'
    const pending = new Map()
    let ready = false

    function request(type, fields = {}) {
        const id = crypto.randomUUID()
        const timer = setTimeout(() => {
            pending.delete(id)
            status.textContent = 'No response from the viewer. Check plugin configuration.'
        }, 5000)
        pending.set(id, timer)
        iframe.contentWindow.postMessage({ channel, version: 1, id, type, ...fields }, viewerOrigin)
    }

    window.addEventListener('message', event => {
        if (event.origin !== viewerOrigin || event.source !== iframe.contentWindow) return
        const data = event.data
        if (!data || typeof data !== 'object' || Array.isArray(data)
            || data.channel !== channel || data.version !== 1) return
        if (data.type === 'ready' && Object.keys(data).length === 3) {
            request('get-state')
            return
        }
        if (typeof data.cubeVisible !== 'boolean') return
        if (data.type === 'state' && Object.keys(data).length === 5
            && typeof data.id === 'string' && pending.has(data.id)) {
            clearTimeout(pending.get(data.id))
            pending.delete(data.id)
        } else if (data.type !== 'cube-visibility-changed' || Object.keys(data).length !== 4) {
            return
        }
        ready = true
        show.disabled = hide.disabled = false
        status.textContent = data.cubeVisible ? 'Cube is visible' : 'Cube is hidden'
    })

    iframe.addEventListener('load', () => {
        // A ready event can precede load. Request state as well to cover either ordering.
        if (!ready) request('get-state')
    })
    show.addEventListener('click', () => request('set-cube-visible', { visible: true }))
    hide.addEventListener('click', () => request('set-cube-visible', { visible: false }))
    iframe.src = viewerUrl
</script>
</html>
